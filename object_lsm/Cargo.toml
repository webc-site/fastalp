[package]
name = "wedb_object_lsm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Object-storage-backed LSM storage engine implementing wedb_embed_engine traits / 基于对象存储(S3/R2/MinIO)的 LSM 存储引擎，实现 wedb_embed_engine 通用 Trait"
keywords = ["database", "storage-engine", "lsm-tree", "s3", "object-storage", "r2"]
categories = ["database-implementations", "data-structures", "embedded"]

[dependencies]
wedb_embed_engine = { path = "../engine" }
crc32fast = "1.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wedb_embed = { path = "../embed", optional = true }
object_store = { version = "0.11", default-features = false, features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
md-5 = { version = "0.10", optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = []
wedb = ["dep:wedb_embed"]
r2 = ["dep:object_store", "dep:tokio", "dep:futures-util", "dep:md-5"]

[dev-dependencies]
divan = "0.1.21"
tempfile = "3"
serde_json = "1"

[[bench]]
name = "bench"
harness = false






[[bench]]
name = "bench_remote"
harness = false
required-features = ["r2", "wedb"]

[[bench]]
name = "bench_r2_soak"
harness = false
required-features = ["r2"]

