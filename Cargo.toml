[workspace]
resolver = "3"
members = []

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = ""
homepage = ""

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
